<style>
/* Layout: infinite blueprint canvas with semantic zoom (left) + reading panel (right); stacks on phones */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --canvas:#ECEEF4; --ink:#191C27; --muted:#596079; --line:#D6DAE5; --grid:#D3D7E2;
  --dom:#4B3FB0; --dom-soft:#ECEAFD; --dom-ink:#2B237A;
  --ct:#A2560B; --ct-soft:#FBEEDB; --ct-ink:#663505;
  --ad:#2C5F97; --ad-soft:#DCEAF9; --ad-ink:#11375E;
  --warn:#B0322F; --warn-soft:#FBE6E5;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121A; --surface:#191C26; --canvas:#141720; --ink:#E6E8F1; --muted:#9BA1B6; --line:#2B2F3E; --grid:#262A39;
  --dom:#A49CF2; --dom-soft:#231F3D; --dom-ink:#DCD8FF;
  --ct:#E6A250; --ct-soft:#30241A; --ct-ink:#F7DBB6;
  --ad:#82B2E9; --ad-soft:#172739; --ad-ink:#D3E5F8;
  --warn:#EF7F7A; --warn-soft:#391F20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#191C26; --canvas:#141720; --ink:#E6E8F1; --muted:#9BA1B6; --line:#2B2F3E; --grid:#262A39;
  --dom:#A49CF2; --dom-soft:#231F3D; --dom-ink:#DCD8FF;
  --ct:#E6A250; --ct-soft:#30241A; --ct-ink:#F7DBB6;
  --ad:#82B2E9; --ad-soft:#172739; --ad-ink:#D3E5F8;
  --warn:#EF7F7A; --warn-soft:#391F20; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.navbtns{display:flex;align-items:center;gap:6px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.pill:focus-visible,.crumb:focus-visible{outline:2px solid var(--dom);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:60px;text-align:center}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.pill.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.k-contract .dot{background:var(--ct)} .k-domain .dot{background:var(--dom)} .k-adapter .dot{background:var(--ad)} .k-warn .dot{background:var(--warn)} .k-quality .dot{background:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.stage{position:relative;min-height:0;background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}
.stage svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage svg.dragging{cursor:grabbing}
.crumbs{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:calc(100% - 28px)}
.crumb{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--muted);border-radius:4px}
.crumb.cur{color:var(--ink);font-weight:600;cursor:default}
.sep{color:var(--muted)}
.zoomctl{position:absolute;left:14px;bottom:12px;display:flex;gap:4px}
.zoomctl .btn{min-width:34px;padding:5px 9px}
.hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
aside.panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:22px 24px 40px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.eyebrow.k-contract{background:var(--ct-soft);color:var(--ct-ink)}
.eyebrow.k-domain{background:var(--dom-soft);color:var(--dom-ink)}
.eyebrow.k-adapter{background:var(--ad-soft);color:var(--ad-ink)}
.eyebrow.k-warn{background:var(--warn-soft);color:var(--warn)}
.eyebrow.k-quality{background:var(--canvas);color:var(--ink);border:1px solid var(--line)}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.015em;margin:12px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.panel p{margin:0 0 14px;max-width:62ch}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.panel ul{margin:0;padding-left:18px;display:grid;gap:6px}
.panel li::marker{color:var(--muted)}
.panel code.inl{font-family:var(--font-mono);font-size:.88em}
pre{font-family:var(--font-mono);font-size:12px;line-height:1.55;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0;white-space:pre}
details{border-top:1px solid var(--line);padding:9px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";color:var(--muted);font-family:var(--font-mono);width:12px;flex:none}
details[open] summary::before{content:"–"}
details p{margin:8px 0 2px 20px;color:var(--muted)}
.children{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.up{margin-top:22px;font-size:13px}
/* svg */
svg text{font-family:var(--font-body);fill:var(--ink)}
.t-h{font-weight:600;font-size:15px}
.t-s{font-size:10.5px;font-style:italic;fill:var(--muted)}
.t-b{font-size:11.5px}
.ad .shape,.k-ad>.shape{fill:var(--ad-soft);stroke:var(--ad)}
.ad text{fill:var(--ad-ink)} .ad .t-s{fill:var(--ad)}
.ct .shape,.k-ct>.shape{fill:var(--ct-soft);stroke:var(--ct)}
.ct text{fill:var(--ct-ink)} .ct .t-s{fill:var(--ct)}
.dm .shape,.k-dm>.shape{fill:var(--surface);stroke:var(--dom)}
.dm text{fill:var(--dom-ink)} .dm .t-s{fill:var(--dom)}
.wr .shape,.k-wr>.shape{fill:var(--warn-soft);stroke:var(--warn)}
.wr text{fill:var(--warn)}
.ql .shape,.k-ql>.shape{fill:var(--surface);stroke:var(--muted)}
.shape{stroke-width:1.4;vector-effect:non-scaling-stroke}
.k-ad>text{fill:var(--ad-ink)} .k-ct>text{fill:var(--ct-ink)} .k-dm>text{fill:var(--dom-ink)} .k-wr>text{fill:var(--warn)} .k-ql>text{fill:var(--ink)}
.gn>.shape{fill-opacity:.9}
.gl text{font-family:var(--font-mono)}
.ghost{opacity:.6}
.hex{fill:var(--dom-soft);stroke:var(--dom);stroke-width:2;vector-effect:non-scaling-stroke}
.bound{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:9 6;vector-effect:non-scaling-stroke}
.sock-d{fill:var(--dom)} .sock-c{fill:var(--ct)} .hole-d{fill:var(--dom-soft)} .hole-c{fill:var(--ct-soft)}
.prong{fill:var(--ad)}
.wire{fill:none;stroke:var(--muted);stroke-width:1.4}
.wire-c{fill:none;stroke:var(--ct);stroke-width:1.4;stroke-dasharray:5 4}
.wire-e{fill:none;stroke:var(--dom);stroke-width:1.4;stroke-dasharray:6 4}
.hit{cursor:pointer}
.hit:hover>.shape,.hit.hexwrap:hover .hex{stroke-width:2.6}
.sel>.shape,.sel.hexwrap .hex{stroke-width:3}
.lod{opacity:0;pointer-events:none;transition:opacity .3s ease}
.lod.on{opacity:1;pointer-events:auto}
.sum{transition:opacity .3s ease}
.sum.off{opacity:0}
@media (prefers-reduced-motion: reduce){.lod,.sum{transition:none}}
@media (max-width:880px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  aside.panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .hint{display:none}
  .panel h2{font-size:24px}
}
</style>

public ResponseEntity<LoanDto> borrowBook(BorrowRequestDto request) {
    Loan loan = loanUseCases.borrow(new MemberId(request.getMemberId()), new BookId(request.getBookId()));

}`,

    c:`private static LoanDto toDto(Loan loan) {
    return new LoanDto(

                    loan.memberId().value(),

 {id:'handler', label:'Foutafhandeling', k:'adapter', region:[90,520,330,115], slot:[110,580,280,38],
  e:'Inbound adapter · fouten', t:'ErrorHandler',
  b:'Eén centrale plek die fouten vertaalt naar de responses die het contract belooft. Spring stuurt elke exceptie die uit een controller komt hierheen.',
  p:['Elke domeinfout is een eigen exception-klasse','Eén @ExceptionHandler voor de 404-fouten, één voor de 409-fouten','extends ResponseEntityExceptionHandler: Springs eigen fouten (validatie, ongeldige JSON, verkeerd type) worden ook ProblemDetail','Elke fout heeft zo dezelfde vorm: application/problem+json'],
  c:`@RestControllerAdvice
class ErrorHandler extends ResponseEntityExceptionHandler {

    @ExceptionHandler({MemberNotFoundException.class, BookNotFoundException.class, LoanNotFoundException.class})
    ProblemDetail handleNotFound(RuntimeException exception) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, exception.getMessage());
    }

    @ExceptionHandler({
        BookAlreadyOnLoanException.class,
        MaxLoansReachedException.class,
        LoanAlreadyReturnedException.class
    })
    ProblemDetail handleConflict(RuntimeException exception) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, exception.getMessage());
    }
}`,
  q:[['Waarom geen try/catch in de controller?','Dan herhaal je de vertaling in elke methode. Eén advice houdt de controller schoon en de foutvorm overal gelijk.'],
     ['Waarom extends ResponseEntityExceptionHandler?','Zonder die basisklasse geeft Spring bij een ontbrekend veld wel 400, maar met een lege body en geen problem+json. Dan hebben 400-fouten een andere vorm dan 404 en 409, en dat breekt het contract.'],
     ['Kan dit ook met spring.mvc.problemdetails.enabled?','Ja, die property registreert zo\'n handler zelf. Omdat er voor de domeinfouten toch een eigen advice nodig is, staat alle foutafhandeling nu in één klasse.']],

   {id:'w-tx', t:'Transacties', s:'niet gebouwd', l:['nu: geen @Transactional','optie 1: decorator','optie 2: @Transactional','  op LoanService'],

  p:['Domeinmodel: objecten met hun eigen regels, geen anemic model','LoanService: use cases en regels die over meerdere objecten gaan','Ubiquitous language: borrow, returnBook, Loan, Member, woorden die een bibliothecaris herkent'],

     {id:'s-borrow', t:'borrow()', l:['1 lid bestaat?   404','2 boek bestaat?  404','3 < 3 lopend?    409','4 boek vrij?     409','5 start + save'],
      b:'De volgorde van de checks is bewust: eerst bestaan (404), dan regels (409).',
      c:`public Loan borrow(MemberId memberId, BookId bookId) {
  if (!members.exists(memberId)) {
    throw new MemberNotFoundException(memberId);
  }
  if (!books.exists(bookId)) {
    throw new BookNotFoundException(bookId);
  }
  if (loans.findActiveByMember(memberId).size() >= MAX_ACTIVE_LOANS) {
    throw new MaxLoansReachedException(memberId);
  }
  if (loans.isOnLoan(bookId)) {
    throw new BookAlreadyOnLoanException(bookId);
  }
  return loans.save(Loan.start(memberId, bookId, clock.instant()));
}`,

     {id:'o-fake', t:'InMemory fake', s:'alleen in tests', l:['Map<LoanId, Loan>','zelfde gedrag'],
      b:'Een implementatie van LoanRepository met een HashMap, voor de domeintests. Geen database, geen Spring, milliseconden.',
      c:`class InMemoryLoanRepository implements LoanRepository {
  private final Map<LoanId, Loan> store = new HashMap<>();

  @Override
  public Optional<Loan> findById(LoanId loanId) {
    return Optional.ofNullable(store.get(loanId));
  }

  @Override
  public List<Loan> findActiveByMember(MemberId memberId) {
    return store.values().stream()
        .filter(loan -> loan.isActive() && loan.memberId().equals(memberId))
        .toList();
  }

  @Override
  public boolean isOnLoan(BookId bookId) {
    return store.values().stream()
        .anyMatch(loan -> loan.isActive() && loan.bookId().equals(bookId));
  }

  @Override
  public Loan save(Loan loan) {
    store.put(loan.id(), loan);
    return loan;
  }
}`,

 {id:'events', label:'Event-driven', k:'domain', region:[920,280,680,210], slot:[1350,352,220,110],
  e:'Event-driven · later', t:'Event-driven',
  b:'Niet gebouwd, wel doordacht. Lending publiceert wat er gebeurd is; andere contexts reageren erop zonder dat Lending ze kent.',
  p:['Een event is een feit in de verleden tijd, en ook een contract (bijvoorbeeld in AsyncAPI)','Flock gaf aan dat dit het minst belangrijk is; met één context luistert er ook nog niemand'],

   {id:'e-event', t:'BookReturned', s:'domain event', l:['LoanId, BookId, Instant','verleden tijd = feit'],

   {id:'e-port', t:'DomainEvents', s:'outbound port', l:['publish(LendingEvent)','transport = adapter'],

// in LoanService.returnBook(...)
events.publish(new BookReturned(loan.id(), loan.bookId(), clock.instant()));`},
   {id:'e-outbox', t:'Outbox', l:['INSERT outbox_event','zelfde transactie','relay → Kafka'],
    b:'Schrijft het event in dezelfde transactie als de lening. Een apart proces publiceert het daarna.',
    q:[['Waarom een outbox?','Zonder outbox kan het opslaan slagen en het publiceren mislukken, of andersom. Met een outbox gaan ze samen of allebei niet.']]},
   {id:'e-res', t:'Reservations', s:'andere context', l:['luistert','waarschuwt volgend lid'],
    b:'Een toekomstige context met een wachtlijst. Hij reageert op BookReturned; Lending hoeft daarvoor niets te veranderen.'}

 ]};

/* ---------- index tree ---------- */
const byId = {}; const order = [];
const KIND = {contract:'ct', domain:'dm', adapter:'ad', warn:'wr', quality:'ql'};
(function walk(n, parent){
  n.parent = parent ? parent.id : null;
  n.k = n.k || (parent && parent.k) || 'quality';
  n.label = n.label || n.t;
  n.e = n.e || (parent ? parent.t : '');
  byId[n.id] = n; order.push(n.id);
  (n.ch||[]).forEach(c => walk(c, n));
})(TREE, null);

const svg = document.getElementById('world');
const NS = 'http://www.w3.org/2000/svg';
const panel = document.getElementById('panel');
const pills = document.getElementById('pills');
const crumbs = document.getElementById('crumbs');
const count = document.getElementById('count');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const lods = [];
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- build generated detail ---------- */
function gridLayout(n, bx, by, bw, bh){
  const gap = Math.min(bw, bh) * 0.06; let best = null;
  for (let c = 1; c <= n; c++){
    const r = Math.ceil(n/c), cw = (bw-(c-1)*gap)/c, ch = (bh-(r-1)*gap)/r;
    const score = Math.abs(Math.log((cw/ch)/1.7));
    if (!best || score < best.score) best = {c, r, cw, ch, score};
  }
  const out = [];
  for (let i = 0; i < n; i++){
    const col = i % best.c, row = Math.floor(i / best.c);
    out.push([bx + col*(best.cw+gap), by + row*(best.ch+gap), best.cw, best.ch]);
  }
  return out;
}
function fillBody(node, host, bx, by, bw, bh){
  const g = el('g', {class:'lod'}, host);
  lods.push({g, w:bw, id:node.id});
  if (node.ch && node.ch.length && !node.region || (node.ch && node.slot)){
    gridLayout(node.ch.length, bx, by, bw, bh).forEach((r, i) => buildNode(node.ch[i], g, r));
  } else if (node.l){
    drawLines(node.l, g, bx, by, bw, bh);
  }
}
function drawLines(lines, g, bx, by, bw, bh){
  const maxLen = Math.max(...lines.map(s => s.length), 8);
  const fs = Math.min(bh/(lines.length*1.45 + .2), bw/(maxLen*0.62));
  const gl = el('g', {class:'gl'}, g);
  lines.forEach((s, i) => { const t = el('text', {x:bx, y:by + fs*(1.05 + i*1.45), 'font-size':fs}, gl); t.textContent = s; });
}
function buildNode(node, parentG, [x,y,w,h]){
  node.rect = [x,y,w,h];
  const g = el('g', {class:'hit gn k-'+KIND[node.k], 'data-node':node.id, tabindex:'0', role:'button', 'aria-label':node.t}, parentG);
  el('rect', {class:'shape', x, y, width:w, height:h, rx:Math.min(w,h)*0.08}, g);
  const pad = Math.min(w,h)*0.07;
  const ts = Math.min(h*0.2, (w-2*pad)/(Math.max(node.t.length,5)*0.6));
  const tt = el('text', {x:x+w/2, y:y+pad+ts*0.9, 'text-anchor':'middle', 'font-size':ts, 'font-weight':600}, g); tt.textContent = node.t;
  let top = y + pad + ts*1.25;
  if (node.s){ const ss = ts*0.62; const st = el('text', {x:x+w/2, y:top+ss*0.75, 'text-anchor':'middle', 'font-size':ss, 'font-style':'italic', opacity:.75}, g); st.textContent = node.s; top += ss*1.2; }
  const by = top + pad*0.3, bh = y + h - pad - by, bx = x + pad, bw = w - 2*pad;
  if (bh > 0 && (node.ch || node.l)) fillBody(node, g, bx, by, bw, bh);
}
// attach detail to hand-drawn nodes
order.forEach(id => {
  const n = byId[id]; if (!n.slot) return;
  const host = svg.querySelector('[data-node="'+id+'"]'); if (!host) return;
  const [bx,by,bw,bh] = n.slot;
  const g = el('g', {class:'lod'}, host);
  lods.push({g, w:bw, id, sums:[...svg.querySelectorAll('.sum[data-for="'+id+'"]')]});
  if (n.ch) gridLayout(n.ch.length, bx, by, bw, bh).forEach((r,i) => buildNode(n.ch[i], g, r));
  else if (n.l) drawLines(n.l, g, bx, by, bw, bh);
});

/* ---------- viewport ---------- */
let vb = [0,0,1600,1040], anim = null, stageRect = svg.getBoundingClientRect();
new ResizeObserver(() => { stageRect = svg.getBoundingClientRect(); updateLOD(); }).observe(svg);
function setVB(v){ vb = v; svg.setAttribute('viewBox', v.join(' ')); updateLOD(); }
function effW(){ const a = stageRect.width/Math.max(stageRect.height,1); return Math.max(vb[2], vb[3]*a); }
function updateLOD(){
  const W = effW();
  lods.forEach(o => {
    const on = o.w / W > 0.14;
    if (o.on !== on){ o.on = on; o.g.classList.toggle('on', on); (o.sums||[]).forEach(s => s.classList.toggle('off', on)); }
  });
}
function regionOf(n){
  if (n.region) return n.region;
  const [x,y,w,h] = n.rect, px = w*0.18, py = h*0.18;
  return [x-px, y-py, w+2*px, h+2*py];
}
function animateTo(target){
  if (anim) cancelAnimationFrame(anim);
  if (reduce){ setVB(target.slice()); return; }
  const from = vb.slice(), start = performance.now(), dur = 750;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  // size interpolates in log-space so deep zooms feel even; centre moves linearly
  const lerp = (a,b,t) => a + (b-a)*t, lerpLog = (a,b,t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
  const fc = [from[0]+from[2]/2, from[1]+from[3]/2], tc = [target[0]+target[2]/2, target[1]+target[3]/2];
  const step = now => {
    const t = Math.min(1,(now-start)/dur), e = ease(t);
    const w = lerpLog(from[2], target[2], e), h = lerpLog(from[3], target[3], e);
    const cx = lerp(fc[0], tc[0], e), cy = lerp(fc[1], tc[1], e);
    setVB([cx - w/2, cy - h/2, w, h]);
    if (t<1) anim = requestAnimationFrame(step); else { anim = null; setVB(target.slice()); }
  };
  anim = requestAnimationFrame(step);
}
function toSvg(cx, cy){ const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(p, k){
  const [x,y,w,h] = vb; const nw = Math.min(Math.max(w*k, 4), 6000); k = nw/w;
  setVB([p.x-(p.x-x)*k, p.y-(p.y-y)*k, w*k, h*k]);
}
function stopAnim(){ if (anim){ cancelAnimationFrame(anim); anim = null; } }
svg.addEventListener('wheel', e => {
  e.preventDefault(); stopAnim();
  const p = toSvg(e.clientX, e.clientY);
  const d = e.deltaMode === 1 ? e.deltaY*16 : e.deltaY;
  zoomAt(p, Math.exp(d * (e.ctrlKey ? 0.01 : 0.0016)));
}, {passive:false});

const ptrs = new Map(); let drag = null, moved = false, downTarget = null, pinch = null;
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  stopAnim();
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
  if (ptrs.size === 1){ drag = {x:e.clientX, y:e.clientY, vb:vb.slice(), s:1/svg.getScreenCTM().a}; moved = false; downTarget = e.target; }
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; moved = true; }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch){
    const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const s = 1/svg.getScreenCTM().a;
    setVB([vb[0] - (mx-pinch.mx)*s, vb[1] - (my-pinch.my)*s, vb[2], vb[3]]);
    zoomAt(toSvg(mx,my), pinch.d / Math.max(d,1));
    pinch = {d, mx, my}; return;
  }
  if (drag && ptrs.size === 1){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx,dy) > 5){ moved = true; svg.classList.add('dragging'); }
    if (moved) setVB([drag.vb[0] - dx*drag.s, drag.vb[1] - dy*drag.s, drag.vb[2], drag.vb[3]]);
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){
    svg.classList.remove('dragging');
    if (!moved && downTarget && e.type === 'pointerup'){
      const hit = downTarget.closest && downTarget.closest('.hit');
      if (hit) go(hit.dataset.node); else { const p = byId[current].parent; go(p || 'overview'); }
    }
    drag = null; downTarget = null;
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('keydown', e => {
  const hit = e.target.closest && e.target.closest('.hit');
  if (hit && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.stopPropagation(); go(hit.dataset.node); }
});
function zoomCenter(k){ stopAnim(); zoomAt({x:vb[0]+vb[2]/2, y:vb[1]+vb[3]/2}, k); }
document.getElementById('z-in').addEventListener('click', () => zoomCenter(1/1.4));
document.getElementById('z-out').addEventListener('click', () => zoomCenter(1.4));
document.getElementById('z-fit').addEventListener('click', () => animateTo(regionOf(byId[current])));

/* ---------- panel + navigation ---------- */
let current = 'overview';
function lineage(id){ const out=[]; let n=byId[id]; while(n){ out.unshift(n.id); n = n.parent ? byId[n.parent] : null; } return out; }
TREE.ch.forEach(n => {
  const b = document.createElement('button');
  b.type='button'; b.className='pill k-'+n.k; b.dataset.node=n.id;
  b.innerHTML = '<span class="dot"></span>' + esc(n.label);
  b.addEventListener('click', () => go(n.id));
  pills.appendChild(b);
});
(function(){ const b = document.createElement('button'); b.type='button'; b.className='pill k-quality'; b.dataset.node='overview'; b.innerHTML='<span class="dot"></span>Overzicht'; b.addEventListener('click',()=>go('overview')); pills.prepend(b); })();

function renderPanel(n){
  let h = '<span class="eyebrow k-'+n.k+'">'+esc(n.e)+'</span>';
  h += '<h2>'+esc(n.t)+'</h2>';
  if (n.b) h += '<p>'+esc(n.b)+'</p>';
  if (n.p) h += '<h3>Kernpunten</h3><ul>'+n.p.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
  if (n.ch) h += '<h3>Inzoomen</h3><div class="children">'+n.ch.map(c=>'<button type="button" class="pill k-'+c.k+'" data-go="'+c.id+'"><span class="dot"></span>'+esc(c.label)+'</button>').join('')+'</div>';
  if (n.c) h += '<h3>Code</h3><pre><code></code></pre>';
  if (n.q) h += '<h3>Interviewvragen</h3>'+n.q.map(([q,a])=>'<details><summary>'+esc(q)+'</summary><p>'+esc(a)+'</p></details>').join('');
  if (n.parent) h += '<div class="up"><button type="button" class="btn" data-go="'+n.parent+'">↑ Terug naar '+esc(byId[n.parent].label)+'</button></div>';
  panel.innerHTML = h;
  if (n.c) panel.querySelector('pre code').textContent = n.c;
  panel.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  panel.scrollTop = 0;
}
function renderCrumbs(id){
  const ids = lineage(id);
  crumbs.innerHTML = ids.map((x,i) => { const last = i===ids.length-1;
    return (i? '<span class="sep">›</span>' : '') + '<button type="button" class="crumb'+(last?' cur':'')+'" data-go="'+x+'"'+(last?' aria-current="step"':'')+'>'+esc(byId[x].label)+'</button>'; }).join('');
  crumbs.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}
function go(id){
  if (!byId[id]) return;
  current = id;
  const n = byId[id], line = lineage(id);
  animateTo(regionOf(n));
  renderPanel(n); renderCrumbs(id);
  svg.querySelectorAll('.sel').forEach(e => e.classList.remove('sel'));
  const g = svg.querySelector('[data-node="'+id+'"]'); if (g) g.classList.add('sel');
  const top = line[1] || 'overview';
  pills.querySelectorAll('.pill').forEach(p => { const on = p.dataset.node===top; p.classList.toggle('on', on); if (on) p.scrollIntoView({block:'nearest', inline:'nearest', behavior: reduce?'auto':'smooth'}); });
  const i = order.indexOf(id);
  count.textContent = (i+1)+' / '+order.length;
  document.getElementById('btn-prev').disabled = i===0;
  document.getElementById('btn-next').disabled = i===order.length-1;
  try { history.replaceState(null,'', id==='overview' ? location.pathname + location.search : '#'+id); } catch(_){}
}
function step(d){ const i = order.indexOf(current); const n = order[i+d]; if (n) go(n); }
document.getElementById('btn-prev').addEventListener('click', () => step(-1));
document.getElementById('btn-next').addEventListener('click', () => step(1));
document.getElementById('btn-overview').addEventListener('click', () => go('overview'));
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag === 'summary' || tag === 'input') return;
  if (e.key==='ArrowRight') step(1);
  else if (e.key==='ArrowLeft') step(-1);
  else if (e.key==='Escape'){ const p = byId[current].parent; go(p || 'overview'); }
  else if (e.key==='+' || e.key==='=') zoomCenter(1/1.4);
  else if (e.key==='-') zoomCenter(1.4);
});

updateLOD();
const startId = (location.hash||'').slice(1);
go(byId[startId] ? startId : 'overview');
</script>
